name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build:backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:backend:unit
      - run: npm run test:proposals:unit
      - run: npm run test:rules
      - run: npm run test:backend
      - run: npm run test:proposals
      - run: npm run build
# Production publishing requires a reviewed workflow and protected environment.
  browser:
    # Kiểm tra trình duyệt luồng sửa trực tiếp trên emulator (chỉ dữ liệu giả).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:edit
      - run: npm run test:browser:audit
      - run: npm run test:browser:branch
      - run: npm run test:browser:users
      - run: npm run test:browser:overview
      - run: npm run test:browser:login
      - run: npm run test:browser:nav
      - run: npm run test:browser:create-account
